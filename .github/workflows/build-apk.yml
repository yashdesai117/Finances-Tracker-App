name: Build and Release PaisaTrack APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaisaTrack-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Official GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "PaisaTrack v1.1.0 - Ultra-Premium Bento Update"
          body: |
            ## PaisaTrack Ultra-Premium Bento Release (v1.1.0)
            - ✨ Full 100% Category Breakdown (all categories displayed with budgets & spend).
            - ⚡ Budget Velocity Speedometer Gauge with dynamic daily allowance.
            - 💳 3D Interactive Card Stack (ICICI Credit Card, Salary Debit, Cash).
            - ☀️/🌙 Dual Light & Dark Themes with top-bar toggle.
            - 🏷️ 1-Tap Transaction Recategorization.
            - 📲 In-App direct updater.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
